<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Tuya LAN SDK">
  <title>Tuya LAN SDK</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a3d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="fg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#2b3b53" stroke-width="2"/>

  <!-- signal -->
  <g fill="none" stroke="url(#fg)" stroke-linecap="round" stroke-width="7">
    <path d="M41 42a32 32 0 0 1 46 0" opacity="0.55"/>
    <path d="M53 55a16 16 0 0 1 22 0" opacity="0.85"/>
  </g>

  <!-- plug prongs -->
  <g fill="#bfdbfe">
    <rect x="52" y="64" width="7" height="16" rx="3.5"/>
    <rect x="69" y="64" width="7" height="16" rx="3.5"/>
  </g>

  <!-- plug body -->
  <rect x="44" y="76" width="40" height="30" rx="11" fill="url(#fg)"/>
</svg>
