name: CD - Publish Release

on:
  release:
    types: [published]
  # Manual run, for exactly the case where a release was published before the
  # workflow was ready: attach the artifacts to an existing tag without cutting
  # a new release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the artifacts to (e.g. v2.0.0)'
        required: true

jobs:
  publish-nuget:
    name: Publish .NET to NuGet
    runs-on: ubuntu-latest
    # id-token: OIDC token for trusted publishing (nuget.org swaps it for a
    # one-hour key). contents: write: attach the .nupkg to the release.
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore dotnet/TuyaLan.sln

      - name: Build Release
        run: dotnet build dotnet/TuyaLan.sln --configuration Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack dotnet/TuyaLan.sln --configuration Release --no-build --output ./nupkg

      # Ask for the key as late as possible: it lives for one hour and each
      # token buys exactly one key.
      - name: NuGet login (OIDC to short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org profile name, not the email address
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # A download that works without a package manager, and a permanent copy
      # if the package is ever unlisted.
      - name: Attach the package to the release
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" ./nupkg/*.nupkg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attach-android:
    name: Attach the Android AAR
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build the library
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :tuya-lan:assembleRelease --no-daemon

      - name: Name the artifact after the tag
        run: |
          cp android/tuya-lan/build/outputs/aar/tuya-lan-release.aar \
             "tuya-lan-${{ github.event.release.tag_name }}.aar"

      - name: Attach the AAR to the release
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" tuya-lan-*.aar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
