name: CD - Publish Release

on:
  release:
    types: [published]
  # Manual run, for exactly the case where a release was published before the
  # workflow was ready: attach the artifacts to an existing tag without cutting
  # a new release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the artifacts to (e.g. v2.0.0)'
        required: true

jobs:
  publish-nuget:
    name: Publish .NET to NuGet
    runs-on: ubuntu-latest
    # id-token: OIDC token for trusted publishing (nuget.org swaps it for a
    # one-hour key). contents: write: attach the .nupkg to the release.
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore csharp/TuyaLan.sln

      - name: Build Release
        run: dotnet build csharp/TuyaLan.sln --configuration Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack csharp/src/TuyaLan/TuyaLan.csproj --configuration Release --no-build --output ./nupkg

      # Ask for the key as late as possible: it lives for one hour and each
      # token buys exactly one key.
      - name: NuGet login (OIDC to short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org profile name, not the email address
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # A download that works without a package manager, and a permanent copy
      # if the package is ever unlisted.
      - name: Attach the package to the release
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" ./nupkg/*.nupkg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attach-android:
    name: Attach the Android AAR
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build the library
        run: |
          cd kotlin
          chmod +x gradlew
          ./gradlew :tuya-lan:assembleRelease --no-daemon

      - name: Check the tag and the version agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          version="${tag#v}"
          declared=$(grep -E '^VERSION_NAME=' kotlin/gradle.properties | cut -d= -f2)

          echo "tag:      $tag"
          echo "from tag: $version"
          echo "declared: $declared"

          # Maven Central never allows the same coordinates twice, so publishing a
          # version that does not match the tag either republishes an old one and
          # fails, or publishes a version nobody can find. Fail here instead.
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $tag does not match VERSION_NAME=$declared in kotlin/gradle.properties"
            exit 1
          fi

      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd kotlin
          # The version comes from the tag, never from a stale property: Central
          # rejects a second upload of the same coordinates, so a mismatch must
          # fail here rather than leave a release that looks fine and is not.
          version="${{ github.event.release.tag_name || inputs.tag }}"
          ./gradlew :tuya-lan-core:publishToMavenCentral \
                    -PVERSION_NAME="${version#v}" --no-daemon

      - name: Name the artifacts after the tag
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          cp kotlin/tuya-lan/build/outputs/aar/tuya-lan-release.aar "tuya-lan-$tag.aar"

          # The jar already exists: an AAR is a zip whose classes.jar is the
          # compiled library. The code has no android.* imports, so that jar runs
          # on any JVM - a Java product cannot read an AAR, but it can read this.
          mkdir -p jarout
          unzip -o -q "tuya-lan-$tag.aar" classes.jar -d jarout
          cp jarout/classes.jar "tuya-lan-$tag.jar"

      - name: Attach the AAR to the release
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" tuya-lan-*.aar tuya-lan-*.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
